server {
  listen 80; # nginx port 설정

  location / {
    # `/`으로 접속 시 응답할 정적 파일들이 있는 root 디렉토리 설정
    root /usr/share/nginx/html;

    # 요청된 uri 경로가 root에 존재하면 해당 경로에 있는 정적 파일을 제공. 
    # 그렇지 않다면 `/index.html`을 대신 응답한다. 
    # React로 구현한 웹 페이지는 SPA(Single Page Application)이므로 단 하나의 index.html만 활용하고, 
    # URI 경로는 react router를 이용하여 하나의 페이지 안에서 다른 화면을 보여주는 구조. 
    # 예를 들어 `/product` 라는 URI로 요청이 올 경우, 해당 경로로 응답할 정적 파일이 없으므로
    # 404 에러가 발생하는데, 이를 방지하기 위해 현재 사용자가 보고 있는 index.html을 재전송한다. 
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # docker compose를 이용할 것이므로 백엔드 서비스명이 될 "backend"를 호스트로 입력함. 
    # `/api/`로 시작되는 URI로 요청이 올 경우, 백엔드, 즉 API 서버로 요청을 전달한다. 
    # 리액트에서 `axios.get("/api/...")` 코드가 실행될 때 이 설정이 적용되어 API 서버로 요청이 전달됨. 
    proxy_pass http://backend:8080;

    # 클라이언트가 요청한 원래 `Host` 값을 프록시 서버에 그대로 전달. 
    # 아래와 같이 정의하지 않는 경우, `proxy_set_header Host $proxy_host;`로 지정된다. 
    # 이 경우, 원래 클라이언트가 요청 URL `http://<server-ip-address>`로 요청했을 때의 
    # `Host: <server-ip-address>`가 아닌 프록시 서버의 Host 값으로 변형되어(`Host http://backend:8080`) 
    # 프록시 서버에 전달된다. 이 경우 CORS 문제가 발생한다. 
    # 따라서 CORS 문제 방지를 위해 아래와 같은 속성값을 정의.
    proxy_set_header Host $host;

    # 그 외 실무에서 자주 사용되는 프록시 설정값들
    
    # 프록시 서버의 IP가 아닌 원래 클라이언트의 IP, 즉 실제 방문자의 IP 주소를 그대로 프록시 서버에 전달.
    # proxy_set_header X-Real-IP $remote_addr;

    # proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # 프록시 서버의 응답 프로토콜이 `$scheme`으로 재작성된다.
    # 예를 들어 HTTPS 서버 블록 내에서 정의한 경우, 프록시 서버의 각 HTTP 응답이 
    # HTTPS로 전환된다. 
    # proxy_set_header X-Forwarded-Proto $scheme;

    # 클라이언트가 요청한 원래 호스트를 정의. 
    # proxy_set_header X-Forwarded-Host  $host;

    # 클라이언트가 요청한 원래 포트를 정의. 
    # proxy_set_header X-Forwarded-Port  $server_port;
  }
}